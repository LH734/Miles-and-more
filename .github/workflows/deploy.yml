# Baut die statische Seite und veröffentlicht sie auf GitHub Pages.
# Wird von den beiden Läufen aufgerufen und läuft zusätzlich bei jedem Push auf main.
# Von Hand: Actions → Seite veröffentlichen → Run workflow.
name: Seite veröffentlichen

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'data/**', 'config/**', 'scripts/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # neuesten Stand holen (auch Commits, die der aufrufende Lauf gerade gepusht hat)
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
