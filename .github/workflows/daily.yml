# Lauf A: täglich, ohne KI. Entfernt abgelaufene Angebote und baut die Seite neu.
# Verbraucht kein Claude-Kontingent.
name: Täglicher Lauf

on:
  schedule:
    - cron: '17 3 * * *' # täglich 03:17 UTC (05:17 Uhr MESZ / 04:17 Uhr MEZ)
  workflow_dispatch:

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/daily.mjs
      - run: npm test
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Täglicher Lauf: $(date -u +%F)"
          git push

  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
